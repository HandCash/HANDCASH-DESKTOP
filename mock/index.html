<!doctype html><meta charset="utf-8"><title>HandCash mock</title>
<link rel="stylesheet" href="../src/styles/handcash.css">
<body style="padding:24px;display:grid;gap:24px;max-width:560px;background:var(--hc-bg);color:var(--hc-text)">
<h3>Wallet hero</h3>
<div class="wallet-nav-actions-pill wallet-hero-metric"><button class="fiat-currency-trigger"><span class="wallet-hero-title">B</span><span class="wallet-hero-metric-amount">$0.01</span></button></div>
<h3>Identity (held)</h3>
<section class="handle-ipt" data-aeon-scope="handle-ipt" data-aeon-state="certificate"><div data-aeon-part="held"><button class="identity-qr-handle">$brandon</button><span data-aeon-part="owned">Owned</span><p data-aeon-part="lede">Your handle is a certificate you hold.</p></div></section>
<h3>Identity (empty)</h3>
<section class="handle-ipt" data-aeon-scope="handle-ipt" data-aeon-state="empty"><div data-aeon-part="empty"><p data-aeon-part="lede">No handle yet.</p><button class="identity-claim-btn btn">Claim</button></div></section>
<h3>Friend actions</h3>
<div style="display:flex;gap:8px"><button class="btn">Message</button><button class="btn btn-ghost">Call</button></div>
