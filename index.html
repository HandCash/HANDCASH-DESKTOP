<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>HandCash</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" href="/brand/handcash-mark-green.png" />
    <link rel="apple-touch-icon" href="/brand/handcash-mark-round.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Syncopate:wght@700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- Classic script: free `process` binding before ES modules (scrypt-ts / BRC-156). -->
    <script>
      (function () {
        var g = typeof globalThis !== 'undefined' ? globalThis : window
        if (!g.process || typeof g.process !== 'object') {
          g.process = {
            env: { NETWORK: '', BASEURL: '', NODE_ENV: 'production' },
            browser: true,
            version: 'v18.0.0',
            versions: { node: '18.0.0' },
            platform: 'browser',
            title: 'browser',
            argv: [],
            pid: 0,
            cwd: function () { return '/' },
            nextTick: function (fn) {
              var args = Array.prototype.slice.call(arguments, 1)
              queueMicrotask(function () { fn.apply(null, args) })
            },
          }
        } else {
          g.process.env = g.process.env || {}
          if (g.process.env.NETWORK === undefined) g.process.env.NETWORK = ''
          if (g.process.env.BASEURL === undefined) g.process.env.BASEURL = ''
          if (g.process.env.NODE_ENV === undefined) g.process.env.NODE_ENV = 'production'
          if (typeof g.process.cwd !== 'function') g.process.cwd = function () { return '/' }
          if (typeof g.process.nextTick !== 'function') {
            g.process.nextTick = function (fn) {
              var args = Array.prototype.slice.call(arguments, 1)
              queueMicrotask(function () { fn.apply(null, args) })
            }
          }
        }
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
