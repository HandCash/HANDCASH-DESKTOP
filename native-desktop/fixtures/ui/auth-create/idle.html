<section class="auth-screen" data-aeon-scope="auth" data-aeon-state="idle">
  <div class="auth-copy">
    <h1 class="auth-title">Create wallet</h1>
    <p class="auth-lede">Your keys stay on this device.</p>
  </div>
  <form class="auth-form" data-aeon-part="form">
    <button class="btn btn-primary auth-submit" data-aeon-part="trigger" data-aeon-scope="button" data-aeon-size="md" data-aeon-state="idle" data-aeon-variant="solid" type="submit">
      <span data-aeon-part="label" data-aeon-scope="button">Create</span>
    </button>
    <p class="auth-alt">
      Already have a wallet?
      <button class="auth-alt-link" data-aeon-part="existing-wallet" type="button">Sign in</button>
    </p>
  </form>
</section>
