<div class="auth-shell" data-aeon-scope="auth-shell" data-aeon-state="onboarding">
  <div aria-hidden="true" class="auth-shell-mesh" data-aeon-part="backdrop">
    <svg aria-hidden="true" class="auth-mesh-canvas" data-aeon-part="mesh"/>
  </div>
  <div aria-hidden="true" class="auth-shell-scrim" data-aeon-part="scrim"/>
  <div class="auth-shell-content" data-aeon-part="content">
    <section class="auth-screen" data-aeon-scope="auth" data-aeon-state="onboard-entry">
      <div class="auth-entry-brand" data-aeon-part="entry-brand">
        <div class="brand" data-aeon-part="root" data-aeon-scope="identity">
          <span class="brand-mark-wrap">
            <span class="deferred-image" data-aeon-state="ready">
              <img alt="HandCash" class="brand-logo-mark"/>
            </span>
            <span class="brand-beta">BETA</span>
          </span>
          <div class="brand-wordmark">
            <div class="brand-name">HandCash</div>
          </div>
        </div>
      </div>
      <div class="auth-entry-actions" data-aeon-part="entry-actions">
        <button class="btn btn-primary auth-entry-primary" data-aeon-part="sign-in" data-aeon-scope="button" data-aeon-size="md" data-aeon-state="idle" data-aeon-variant="solid" type="button">
          <span data-aeon-part="label" data-aeon-scope="button">Sign in</span>
        </button>
        <button class="btn btn-ghost auth-entry-secondary" data-aeon-part="create" data-aeon-scope="button" data-aeon-size="md" data-aeon-state="idle" data-aeon-variant="ghost" type="button">
          <span data-aeon-part="label" data-aeon-scope="button">Create new wallet</span>
        </button>
      </div>
      <p class="auth-alt">
        <button class="auth-alt-link" data-aeon-part="migrate" data-aeon-scope="button" data-aeon-size="md" data-aeon-state="idle" data-aeon-variant="ghost" type="button">
          <span data-aeon-part="label" data-aeon-scope="button">Recover an old HandCash wallet</span>
        </button>
      </p>
      <p aria-live="polite" class="auth-entry-tagline is-in" data-aeon-part="entry-tagline">Exchange directly with peers.</p>
    </section>
  </div>
</div>
