<aside aria-label="Activity filters" class="payment-filters" data-aeon-scope="payment-filters">
  <div class="payment-filter-row">
    <span class="payment-filter-row-label">Type</span>
    <div aria-label="Type" class="payment-filter-options" role="group">
      <button aria-pressed="true" class="payment-filter-option is-active" type="button">All</button>
      <button aria-pressed="false" class="payment-filter-option" type="button">Sent</button>
      <button aria-pressed="false" class="payment-filter-option" type="button">Received</button>
      <button aria-pressed="false" class="payment-filter-option" type="button">Actions</button>
    </div>
  </div>
  <div class="payment-filter-row">
    <span class="payment-filter-row-label">Status</span>
    <div aria-label="Status" class="payment-filter-options" role="group">
      <button aria-pressed="true" class="payment-filter-option is-active" type="button">All</button>
      <button aria-pressed="false" class="payment-filter-option" type="button">Success</button>
      <button aria-pressed="false" class="payment-filter-option" type="button">Failed</button>
    </div>
  </div>
  <div class="payment-filter-row">
    <span class="payment-filter-row-label">App</span>
    <div aria-label="App" class="payment-filter-options" role="group">
      <button aria-pressed="true" class="payment-filter-option is-active" type="button">All</button>
      <button aria-pressed="false" class="payment-filter-option" type="button">HandCash</button>
    </div>
  </div>
  <div class="payment-filter-row">
    <span class="payment-filter-row-label">When</span>
    <div aria-label="When" class="payment-filter-options" role="group">
      <button aria-pressed="true" class="payment-filter-option is-active" type="button">Any time</button>
      <button aria-pressed="false" class="payment-filter-option" type="button">24h</button>
      <button aria-pressed="false" class="payment-filter-option" type="button">7d</button>
      <button aria-pressed="false" class="payment-filter-option" type="button">30d</button>
    </div>
  </div>
</aside>
