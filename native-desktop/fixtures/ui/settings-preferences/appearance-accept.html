<section class="settings-group" data-aeon-part="preferences" data-settings-group="Preferences">
  <h3 class="settings-group-title">Preferences</h3>
  <ul class="settings-list">
    <li>
      <div data-aeon-layout="control" data-aeon-part="root" data-aeon-scope="listRow">
        <span aria-hidden="true" data-aeon-part="leading" data-aeon-scope="listRow">
          <span aria-hidden="true" class="settings-row-icon" data-tone="default">
            <svg aria-hidden="true"/>
          </span>
        </span>
        <span data-aeon-part="label" data-aeon-scope="listRow">Appearance</span>
        <span data-aeon-part="description" data-aeon-scope="listRow">Follows Omarchy or your system theme.</span>
        <span data-aeon-part="trailing" data-aeon-scope="listRow">
          <div aria-label="Appearance" class="settings-icon-toggle" data-aeon-part="root" data-aeon-scope="radioGroup" role="radiogroup">
            <div class="settings-icon-toggle-item" data-aeon-part="item" data-aeon-state="selected">
              <span aria-checked="true" aria-label="System" class="settings-icon-toggle-btn" data-aeon-part="itemControl" data-aeon-state="selected" data-highlighted="" data-selected="" role="radio" title="System">
                <svg aria-hidden="true"/>
              </span>
            </div>
            <div class="settings-icon-toggle-item" data-aeon-part="item" data-aeon-state="unselected">
              <span aria-checked="false" aria-label="Dark" class="settings-icon-toggle-btn" data-aeon-part="itemControl" data-aeon-state="unselected" role="radio" title="Dark">
                <svg aria-hidden="true"/>
              </span>
            </div>
            <div class="settings-icon-toggle-item" data-aeon-part="item" data-aeon-state="unselected">
              <span aria-checked="false" aria-label="Light" class="settings-icon-toggle-btn" data-aeon-part="itemControl" data-aeon-state="unselected" role="radio" title="Light">
                <svg aria-hidden="true"/>
              </span>
            </div>
          </div>
        </span>
      </div>
    </li>
    <li>
      <div data-aeon-layout="control" data-aeon-part="root" data-aeon-scope="listRow">
        <span aria-hidden="true" data-aeon-part="leading" data-aeon-scope="listRow">
          <span aria-hidden="true" class="settings-row-icon" data-tone="default">
            <svg aria-hidden="true"/>
          </span>
        </span>
        <span data-aeon-part="label" data-aeon-scope="listRow">Accept</span>
        <span data-aeon-part="description" data-aeon-scope="listRow">Just Bitcoin SV. Bitcoin SV and its tokens. Other coins and tokens backed by them are hidden, not removed.</span>
        <span data-aeon-part="trailing" data-aeon-scope="listRow">
          <div aria-label="Accept" class="settings-icon-toggle" data-aeon-part="root" data-aeon-scope="radioGroup" role="radiogroup">
            <div class="settings-icon-toggle-item" data-aeon-part="item" data-aeon-state="selected">
              <span aria-checked="true" aria-label="Just Bitcoin SV" class="settings-icon-toggle-btn" data-aeon-part="itemControl" data-aeon-state="selected" data-highlighted="" data-selected="" role="radio" title="Just Bitcoin SV">
                <svg aria-hidden="true"/>
              </span>
            </div>
            <div class="settings-icon-toggle-item" data-aeon-part="item" data-aeon-state="unselected">
              <span aria-checked="false" aria-label="Bitcoin SV and crypto" class="settings-icon-toggle-btn" data-aeon-part="itemControl" data-aeon-state="unselected" role="radio" title="Bitcoin SV and crypto">
                <span class="accepted-coins-glyphs">
                  <svg aria-hidden="true"/>
                  <svg aria-hidden="true"/>
                </span>
              </span>
            </div>
          </div>
        </span>
      </div>
    </li>
  </ul>
</section>
