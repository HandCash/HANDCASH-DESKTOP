<div class="wallet-setup-config" data-aeon-scope="onboard-fiat" data-aeon-state="usd">
  <h2>Show balances in</h2>
  <p class="auth-lede">Government currency for totals on the home screen. You can change this anytime from Activity.</p>
  <div aria-label="Government currency" class="onboard-fiat-options" data-aeon-part="fiat" role="listbox">
    <button aria-label="USD — US Dollar" aria-selected="true" class="onboard-fiat-option" data-aeon-state="selected" role="option" type="button">
      <span aria-hidden="true" class="onboard-fiat-flag">🇺🇸</span>
      <span class="onboard-fiat-iso">USD</span>
    </button>
    <button aria-label="EUR — Euro" aria-selected="false" class="onboard-fiat-option" data-aeon-state="idle" role="option" type="button">
      <span aria-hidden="true" class="onboard-fiat-flag">🇪🇺</span>
      <span class="onboard-fiat-iso">EUR</span>
    </button>
    <button aria-label="GBP — British Pound" aria-selected="false" class="onboard-fiat-option" data-aeon-state="idle" role="option" type="button">
      <span aria-hidden="true" class="onboard-fiat-flag">🇬🇧</span>
      <span class="onboard-fiat-iso">GBP</span>
    </button>
    <button aria-label="JPY — Japanese Yen" aria-selected="false" class="onboard-fiat-option" data-aeon-state="idle" role="option" type="button">
      <span aria-hidden="true" class="onboard-fiat-flag">🇯🇵</span>
      <span class="onboard-fiat-iso">JPY</span>
    </button>
    <button aria-label="CAD — Canadian Dollar" aria-selected="false" class="onboard-fiat-option" data-aeon-state="idle" role="option" type="button">
      <span aria-hidden="true" class="onboard-fiat-flag">🇨🇦</span>
      <span class="onboard-fiat-iso">CAD</span>
    </button>
    <button aria-label="AUD — Australian Dollar" aria-selected="false" class="onboard-fiat-option" data-aeon-state="idle" role="option" type="button">
      <span aria-hidden="true" class="onboard-fiat-flag">🇦🇺</span>
      <span class="onboard-fiat-iso">AUD</span>
    </button>
    <button aria-label="CHF — Swiss Franc" aria-selected="false" class="onboard-fiat-option" data-aeon-state="idle" role="option" type="button">
      <span aria-hidden="true" class="onboard-fiat-flag">🇨🇭</span>
      <span class="onboard-fiat-iso">CHF</span>
    </button>
    <button aria-label="CNY — Chinese Yuan" aria-selected="false" class="onboard-fiat-option" data-aeon-state="idle" role="option" type="button">
      <span aria-hidden="true" class="onboard-fiat-flag">🇨🇳</span>
      <span class="onboard-fiat-iso">CNY</span>
    </button>
    <button aria-label="INR — Indian Rupee" aria-selected="false" class="onboard-fiat-option" data-aeon-state="idle" role="option" type="button">
      <span aria-hidden="true" class="onboard-fiat-flag">🇮🇳</span>
      <span class="onboard-fiat-iso">INR</span>
    </button>
    <button aria-label="BRL — Brazilian Real" aria-selected="false" class="onboard-fiat-option" data-aeon-state="idle" role="option" type="button">
      <span aria-hidden="true" class="onboard-fiat-flag">🇧🇷</span>
      <span class="onboard-fiat-iso">BRL</span>
    </button>
    <button aria-label="MXN — Mexican Peso" aria-selected="false" class="onboard-fiat-option" data-aeon-state="idle" role="option" type="button">
      <span aria-hidden="true" class="onboard-fiat-flag">🇲🇽</span>
      <span class="onboard-fiat-iso">MXN</span>
    </button>
    <button aria-label="KRW — Korean Won" aria-selected="false" class="onboard-fiat-option" data-aeon-state="idle" role="option" type="button">
      <span aria-hidden="true" class="onboard-fiat-flag">🇰🇷</span>
      <span class="onboard-fiat-iso">KRW</span>
    </button>
  </div>
  <div class="auth-actions" data-aeon-part="onboard-fiat-actions">
    <button class="btn btn-primary auth-submit" data-aeon-part="root" data-aeon-scope="button" data-aeon-size="md" data-aeon-state="idle" data-aeon-variant="solid" type="button">
      <span data-aeon-part="label" data-aeon-scope="button">Continue</span>
    </button>
  </div>
</div>
