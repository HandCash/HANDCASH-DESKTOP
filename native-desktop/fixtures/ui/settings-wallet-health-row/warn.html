<ul class="settings-list">
  <li class="settings-nav-item">
    <button class="settings-nav-row" data-aeon-part="root" data-aeon-scope="listRow" type="button">
      <span aria-hidden="true" data-aeon-part="leading" data-aeon-scope="listRow">
        <span aria-hidden="true" class="settings-row-icon" data-tone="default">
          <svg aria-hidden="true"/>
        </span>
      </span>
      <span data-aeon-part="label" data-aeon-scope="listRow">Wallet health</span>
      <span data-aeon-part="description" data-aeon-scope="listRow" data-aeon-state="warn">1 of 5 checks degraded</span>
      <span data-aeon-part="trailing" data-aeon-scope="listRow">
        <div aria-hidden="true" class="settings-icon-toggle wallet-health-trailing">
          <span class="settings-icon-toggle-btn wallet-health-alert" data-selected="" data-tone="warn">
            <svg aria-hidden="true"/>
          </span>
        </div>
      </span>
    </button>
  </li>
</ul>
