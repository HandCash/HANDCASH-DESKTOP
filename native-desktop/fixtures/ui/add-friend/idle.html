<div class="nav-child-panel add-friend-panel" data-aeon-scope="add-friend">
  <form class="friends-add-form" data-aeon-part="add-friend-form" data-aeon-scope="add-friend" data-aeon-state="idle">
    <div class="add-friend-content">
      <header class="add-friend-intro">
        <span aria-hidden="true" class="add-friend-intro-icon">
          <svg aria-hidden="true"/>
        </span>
        <div>
          <h3>Add someone you trust</h3>
          <p>Use their $handle, peer payment link, or wallet key.</p>
        </div>
      </header>
      <div class="field" data-aeon-interaction="pristine" data-aeon-part="root" data-aeon-scope="field" data-aeon-state="idle" data-aeon-submission="idle" data-aeon-validation="valid">
        <label data-aeon-part="label" for="friend-key">Handle or wallet key</label>
        <input class="mono" data-aeon-part="control" id="friend-key" placeholder="$alice, peerpay:…, or 02… / 03…"/>
      </div>
    </div>
    <div class="actions add-friend-actions" data-aeon-part="actions" data-aeon-state="idle">
      <button class="btn btn-primary" data-aeon-part="primary" disabled="" type="submit">Add friend</button>
      <button class="btn btn-ghost" data-aeon-part="secondary" type="button">Cancel</button>
    </div>
  </form>
</div>
