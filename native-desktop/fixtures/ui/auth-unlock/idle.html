<section class="auth-screen" data-aeon-scope="auth" data-aeon-state="idle">
  <div class="auth-copy">
    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-lede">Unlock with this device, or restore from a backup.</p>
  </div>
  <form class="auth-form" data-aeon-part="form">
    <button class="btn btn-primary auth-submit" data-aeon-part="trigger" data-aeon-scope="button" data-aeon-size="md" data-aeon-state="idle" data-aeon-variant="solid" type="submit">
      <span data-aeon-part="label" data-aeon-scope="button">Unlock</span>
    </button>
  </form>
</section>
