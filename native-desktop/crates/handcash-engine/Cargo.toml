[package]
name = "handcash-engine"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
base64 = "0.22"
handcash-bitcoin = { path = "../handcash-bitcoin" }
handcash-net = { path = "../handcash-net" }
handcash-primitives = { path = "../handcash-primitives" }
handcash-storage = { path = "../handcash-storage" }
hex = "0.4"
icu_collator = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
