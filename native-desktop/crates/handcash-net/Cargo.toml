[package]
name = "handcash-net"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
base64 = "0.22"
handcash-bitcoin = { path = "../handcash-bitcoin" }
handcash-primitives = { path = "../handcash-primitives" }
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
