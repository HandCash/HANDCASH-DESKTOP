[package]
name = "handcash-primitives"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
aes = "0.8"
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
bip39 = "2"
bs58 = { version = "0.5", features = ["check"] }
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
k256 = { version = "0.13", features = ["ecdsa", "ecdh", "arithmetic", "expose-field"] }
rand = "0.8"
ring = "0.17"
ripemd = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-normalization = "0.1"
zeroize = { version = "1", features = ["derive"] }
