[package]
name = "handcash-app"
version = "0.1.0"
edition = "2021"
description = "100% Pure-Rust HandCash Desktop wallet built on Aeon UI (aeon-ui / aeon-dioxus) + Dioxus Native (Blitz: Stylo + Vello/wgpu, zero WebKitGTK, zero Node/TS)"
license = "Apache-2.0"
publish = false

[features]
# Blitz (Dioxus Native) stays the default renderer; packaging and install are unchanged.
default = ["native"]
native = ["dep:dioxus-native"]
# Side-by-side Blitz-free renderer (aeon-native: Taffy + Parley + Vello). Opt in with
# `cargo run -p handcash-app --features aeon --bin handcash-aeon`.
aeon = ["dep:aeon-native", "dep:png"]

[[bin]]
name = "handcash-native"
path = "src/main.rs"
required-features = ["native"]

[[bin]]
name = "handcash-aeon"
path = "src/bin/handcash-aeon.rs"
required-features = ["aeon"]

[dependencies]
aeon-core = "0.3.0"
aeon-dioxus = "0.4.0"
aeon-primitives = "0.3.0"
aeon-ui = "0.4.0"
arboard = { version = "3", features = ["wayland-data-control"] }
base64 = "0.22"
bs58 = "0.5"
dioxus = { version = "0.7.10", default-features = false, features = ["macro", "html", "signals", "hooks"] }
dioxus-native = { version = "0.7.10", optional = true }
aeon-native = { version = "0.1.3", optional = true }
# aeon-native paints predecoded pixels only; bundled brand PNGs are decoded here.
png = { version = "0.17", optional = true }
handcash-bitcoin = { path = "../handcash-bitcoin" }
handcash-engine = { path = "../handcash-engine" }
handcash-machines = { path = "../handcash-machines" }
handcash-net = { path = "../handcash-net" }
handcash-primitives = { path = "../handcash-primitives" }
handcash-shell = { path = "../..", default-features = false }
handcash-storage = { path = "../handcash-storage" }
hex = "0.4"
open = "5"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
dioxus-ssr = "0.7.10"
