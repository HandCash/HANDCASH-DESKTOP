[package]
name = "handcash-shell"
version = "0.1.0"
edition = "2021"
description = "Pure-Rust Win/Linux WebView host for HandCash Desktop (tao + wry + built-in BRC-100/UI servers, zero Node)"
license = "Open BSV License"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
sha2 = "0.10"
hex = "0.4"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
keyring = "3"
# wayland-data-control: Hyprland / wlroots paste without relying on Xwayland.
# Clipboard must stay alive after set_text or Wayland clears the selection.
arboard = { version = "3", features = ["wayland-data-control"] }
image = { version = "0.25", default-features = false, features = ["png"] }
open = "5"
tiny_http = "0.12"
ctrlc = "3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
ring = "0.17"
if-addrs = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tao = "0.30"
wry = "0.48"
http = "1"

# Match wry 0.48's webkit2gtk pin so `<input type=file>` can use run-file-chooser.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.1", features = ["v2_38"] }
gtk = "0.18"

[profile.release]
lto = true
codegen-units = 1
strip = true
