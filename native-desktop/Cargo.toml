[workspace]
members = [
    ".",
    "crates/handcash-primitives",
    "crates/handcash-bitcoin",
    "crates/handcash-storage",
    "crates/handcash-net",
    "crates/handcash-engine",
    "crates/handcash-machines",
    "crates/handcash-app",
]
resolver = "2"

[package]
name = "handcash-shell"
version = "0.1.0"
edition = "2021"
description = "Pure-Rust HandCash Desktop host, headless sidecar, and platform-neutral wallet core foundation (zero Node)"
license = "Apache-2.0"
publish = false

[features]
default = ["webview"]
webview = ["dep:tao", "dep:wry", "dep:http", "dep:webkit2gtk", "dep:gtk"]

[[bin]]
name = "handcash-shell"
path = "src/main.rs"
required-features = ["webview"]

[[bin]]
name = "handcash-sidecar"
path = "src/bin/handcash-sidecar.rs"

[dependencies]
handcash-bitcoin = { path = "crates/handcash-bitcoin" }
handcash-engine = { path = "crates/handcash-engine" }
handcash-net = { path = "crates/handcash-net" }
handcash-primitives = { path = "crates/handcash-primitives" }
handcash-storage = { path = "crates/handcash-storage" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
sha2 = "0.10"
hex = "0.4"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
keyring = "3"
# wayland-data-control: Hyprland / wlroots paste without relying on Xwayland.
# Clipboard must stay alive after set_text or Wayland clears the selection.
arboard = { version = "3", features = ["wayland-data-control"] }
image = { version = "0.25", default-features = false, features = ["png"] }
open = "5"
tiny_http = "0.12"
ctrlc = "3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
ring = "0.17"
if-addrs = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tao = { version = "0.30", optional = true }
wry = { version = "0.48", optional = true }
http = { version = "1", optional = true }

# Match wry 0.48's webkit2gtk pin so `<input type=file>` can use run-file-chooser.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.1", features = ["v2_38"], optional = true }
gtk = { version = "0.18", optional = true }

# Development-only CSS parity candidate; upstream changes are not published.
# Remove this local patch when a reviewed registry release is approved.
[patch.crates-io]
aeon-native = { path = "/home/spider/Work/aeon-ui/crates/aeon-native" }

[profile.release]
lto = true
codegen-units = 1
strip = true
