[package]
name = "handcash-shell"
version = "0.1.0"
edition = "2021"
description = "Thin Win/Linux WebView host for HandCash Desktop (tao + wry + Node bridge sidecar)"
license = "Open BSV License"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
sha2 = "0.10"
hex = "0.4"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
keyring = "3"
arboard = "3"
open = "5"
tiny_http = "0.12"
ctrlc = "3"

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tao = "0.30"
wry = "0.48"
http = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
