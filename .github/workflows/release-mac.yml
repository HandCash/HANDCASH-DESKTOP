# Build unsigned macOS dmg + zip on GitHub and publish to the matching GitHub Release
# (latest-mac.yml + artifacts for electron-updater). Notarization is intentional later.
#
# Triggers:
#   - push of tag v* (after `npm run version:*` + `git push origin vX.Y.Z`)
#   - manual Run workflow (optional tag, e.g. v1.0.0 to backfill an existing release)

name: Release Mac

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build & upload (e.g. v1.0.0). Leave empty to use the current branch tip / package.json version.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-mac-${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Hermetic regression suite
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run test:ci

      - name: Read version
        id: meta
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Building HandCash ${VERSION} → release ${TAG}"

      - name: Build macOS installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # package.json forces signing and notarization. Until the Developer ID
          # secrets exist the release is built through the explicit unsigned
          # opt-out and flagged on the run, never silently.
          if [[ -n "$CSC_LINK" && -n "$CSC_KEY_PASSWORD" && -n "$APPLE_ID" && -n "$APPLE_APP_SPECIFIC_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
            echo "Signing with Developer ID and notarizing"
          else
            echo "::warning title=Unsigned macOS release::Add the CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID secrets to sign and notarize."
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            export HANDCASH_ALLOW_UNSIGNED=1 CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npm run package:mac -- --publish never

      - name: Verify Mac package integrity
        run: |
          set -euo pipefail
          # package:mac builds the thin native shell for the runner's own
          # architecture only (macos-latest is arm64), so verify that one app.
          if [[ "$(uname -m)" == "arm64" ]]; then ARCH=arm64; DIR=release/mac-arm64; else ARCH=x64; DIR=release/mac; fi
          APP="$DIR/HandCash.app"
          fail=0
          [[ -d "$APP" ]] || { echo "MISSING $APP" >&2; exit 1; }
          PLIST="$APP/Contents/Info.plist"
          RES="$APP/Contents/Resources"
          ID="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$PLIST" 2>/dev/null || true)"
          VER="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$PLIST" 2>/dev/null || true)"
          echo "== $APP =="
          echo "  CFBundleIdentifier=$ID"
          echo "  version=$VER"
          [[ "$ID" == "io.handcash.brc100" ]] || { echo "bad bundle id" >&2; fail=1; }
          [[ "$VER" == "${{ steps.meta.outputs.version }}" ]] || { echo "bundle version $VER != ${{ steps.meta.outputs.version }}" >&2; fail=1; }
          [[ -x "$APP/Contents/MacOS/HandCash" ]] || { echo "missing binary" >&2; fail=1; }
          [[ -x "$RES/node" ]] || { echo "missing bundled node" >&2; fail=1; }
          for f in bridgeSidecar.cjs uiSidecar.cjs handcash-page.js app/index.html; do
            [[ -f "$RES/$f" ]] || { echo "missing Resources/$f" >&2; fail=1; }
          done
          # A linker-only signature (Identifier=Electron, no sealed resources)
          # makes Gatekeeper report "damaged" on Apple Silicon. The packager
          # signs the bundle; refuse to ship if that did not stick.
          codesign --verify --deep --strict "$APP" || { echo "invalid code signature" >&2; fail=1; }
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -q "Identifier=io.handcash.brc100" \
            || { echo "signature not bound to app bundle" >&2; fail=1; }
          ls -lh release/*.dmg release/*.zip release/latest-mac.yml
          test -f "release/HandCash-${{ steps.meta.outputs.version }}-$ARCH-mac.dmg" || { echo "missing $ARCH dmg" >&2; fail=1; }
          test -f "release/HandCash-${{ steps.meta.outputs.version }}-$ARCH-mac.zip" || { echo "missing $ARCH zip" >&2; fail=1; }
          exit "$fail"

      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            NOTES="HandCash Desktop ${{ steps.meta.outputs.version }} (BETA) — macOS build from CI (ad-hoc signed, not yet notarized). Drag to Applications, then run: xattr -cr /Applications/HandCash.app — and open it. Clearing quarantine is needed because the build is not notarized; on macOS 15+ right-click to Open no longer bypasses Gatekeeper."
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "HandCash Desktop ${{ steps.meta.outputs.version }} BETA" \
              --notes "$NOTES" \
              --prerelease \
              --target "${{ github.sha }}"
          fi

      - name: Upload macOS artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          shopt -s nullglob
          artifacts=(release/*.dmg release/*.zip release/*.blockmap)
          metadata=release/latest-mac.yml
          if [ ${#artifacts[@]} -eq 0 ] || [ ! -f "$metadata" ]; then
            echo "No macOS artifacts found under release/" >&2
            ls -la release/ || true
            exit 1
          fi
          for f in "${artifacts[@]}" "$metadata"; do
            name="$(basename "$f")"
            gh release delete-asset "$TAG" "$name" --repo "${{ github.repository }}" --yes 2>/dev/null || true
          done
          # Publish immutable versioned files first. Channel metadata must become
          # visible only after every referenced asset is fully available.
          gh release upload "$TAG" "${artifacts[@]}" --repo "${{ github.repository }}" --clobber
          gh release upload "$TAG" "$metadata" --repo "${{ github.repository }}" --clobber
          echo "Uploaded to $TAG:"
          printf '  %s\n' "${artifacts[@]}" "$metadata"
