# Build unsigned macOS dmg + zip on GitHub and publish to the matching GitHub Release
# (latest-mac.yml + artifacts for electron-updater). Notarization is intentional later.
#
# Triggers:
#   - push of tag v* (after `npm run version:*` + `git push origin vX.Y.Z`)
#   - manual Run workflow (optional tag, e.g. v1.0.0 to backfill an existing release)

name: Release Mac

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build & upload (e.g. v1.0.0). Leave empty to use the current branch tip / package.json version.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-mac-${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read version
        id: meta
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Building HandCash ${VERSION} → release ${TAG}"

      - name: Build macOS installers (unsigned)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run package:mac -- --publish never

      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "HandCash Desktop ${{ steps.meta.outputs.version }} BETA" \
              --notes "HandCash Desktop ${{ steps.meta.outputs.version }} (BETA) — macOS build from CI (unsigned; notarize later)." \
              --prerelease \
              --target "${{ github.sha }}"
          fi

      - name: Upload macOS artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          shopt -s nullglob
          files=(release/*.dmg release/*.zip release/*.blockmap release/latest-mac.yml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No macOS artifacts found under release/" >&2
            ls -la release/ || true
            exit 1
          fi
          for f in "${files[@]}"; do
            name="$(basename "$f")"
            gh release delete-asset "$TAG" "$name" --repo "${{ github.repository }}" --yes 2>/dev/null || true
          done
          gh release upload "$TAG" "${files[@]}" --repo "${{ github.repository }}" --clobber
          echo "Uploaded to $TAG:"
          printf '  %s\n' "${files[@]}"
