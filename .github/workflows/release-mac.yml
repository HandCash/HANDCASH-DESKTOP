# Build unsigned macOS dmg + zip on GitHub and publish to the matching GitHub Release
# (latest-mac.yml + artifacts for electron-updater). Notarization is intentional later.
#
# Triggers:
#   - push of tag v* (after `npm run version:*` + `git push origin vX.Y.Z`)
#   - manual Run workflow (optional tag, e.g. v1.0.0 to backfill an existing release)

name: Release Mac

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build & upload (e.g. v1.0.0). Leave empty to use the current branch tip / package.json version.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-mac-${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read version
        id: meta
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Building HandCash ${VERSION} → release ${TAG}"

      - name: Build macOS installers (unsigned)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run package:mac -- --publish never

      - name: Verify Mac package integrity
        run: |
          set -euo pipefail
          fail=0
          for arch_dir in release/mac-arm64 release/mac; do
            APP="$arch_dir/HandCash.app"
            if [[ ! -d "$APP" ]]; then
              echo "MISSING $APP" >&2
              fail=1
              continue
            fi
            PLIST="$APP/Contents/Info.plist"
            BIN="$APP/Contents/MacOS/HandCash"
            ASAR="$APP/Contents/Resources/app.asar"
            EF="$APP/Contents/Frameworks/Electron Framework.framework/Versions/A/Electron Framework"
            ID="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$PLIST" 2>/dev/null || true)"
            VER="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$PLIST" 2>/dev/null || true)"
            echo "== $APP =="
            echo "  CFBundleIdentifier=$ID"
            echo "  version=$VER"
            [[ "$ID" == "io.handcash.brc100" ]] || { echo "bad bundle id" >&2; fail=1; }
            [[ -x "$BIN" ]] || { echo "missing binary" >&2; fail=1; }
            [[ -f "$ASAR" ]] || { echo "missing app.asar" >&2; fail=1; }
            [[ -f "$EF" ]] || { echo "missing Electron Framework" >&2; fail=1; }
            # A linker-only signature (Identifier=Electron, no sealed resources)
            # makes Gatekeeper report "damaged" on Apple Silicon. afterPack.cjs
            # ad-hoc signs the bundle; refuse to ship if that did not stick.
            codesign --verify --deep --strict "$APP" || { echo "invalid code signature" >&2; fail=1; }
            codesign -dv --verbose=2 "$APP" 2>&1 | grep -q "Identifier=io.handcash.brc100" \
              || { echo "signature not bound to app bundle" >&2; fail=1; }
            # electron-builder --mac dmg/zip should embed updater metadata
            if [[ ! -f "$APP/Contents/Resources/app-update.yml" ]]; then
              echo "WARN: app-update.yml missing in $APP — copying from build/" >&2
              cp build/app-update.yml "$APP/Contents/Resources/app-update.yml"
            fi
          done
          ls -lh release/*.dmg release/*.zip release/latest-mac.yml
          # Ensure both arch DMGs exist (CI previously succeeded without catching empty apps)
          test -f release/HandCash-*-arm64-mac.dmg
          test -f release/HandCash-*-x64-mac.dmg
          exit "$fail"

      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            NOTES="HandCash Desktop ${{ steps.meta.outputs.version }} (BETA) — macOS build from CI (ad-hoc signed, not yet notarized). First launch: right-click HandCash.app and choose Open, then confirm. If macOS still refuses, run xattr -cr /Applications/HandCash.app and reopen."
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "HandCash Desktop ${{ steps.meta.outputs.version }} BETA" \
              --notes "$NOTES" \
              --prerelease \
              --target "${{ github.sha }}"
          fi

      - name: Upload macOS artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          shopt -s nullglob
          files=(release/*.dmg release/*.zip release/*.blockmap release/latest-mac.yml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No macOS artifacts found under release/" >&2
            ls -la release/ || true
            exit 1
          fi
          for f in "${files[@]}"; do
            name="$(basename "$f")"
            gh release delete-asset "$TAG" "$name" --repo "${{ github.repository }}" --yes 2>/dev/null || true
          done
          gh release upload "$TAG" "${files[@]}" --repo "${{ github.repository }}" --clobber
          echo "Uploaded to $TAG:"
          printf '  %s\n' "${files[@]}"
