# Build the thin native Windows zip on GitHub and publish to the matching GitHub Release.
#
# Triggers:
#   - push of tag v* (after `npm run version:*` + `git push origin vX.Y.Z`)
#   - manual Run workflow (optional tag, e.g. v1.0.0 to backfill an existing release)

name: Release Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build & upload (e.g. v1.0.0). Leave empty to use the current branch tip / package.json version.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Hermetic regression suite
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run test:ci

      - name: Read version
        id: meta
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Building HandCash ${VERSION} → release ${TAG}"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Windows thin native package
        shell: bash
        run: |
          set -euo pipefail
          # Thin native shell (no Electron): zip only. NSIS and code signing
          # return with a native installer; electron-builder no longer applies
          # because dist-electron is not built.
          rm -rf release
          npm run package:win
          VERSION="${{ steps.meta.outputs.version }}"
          DIR=release/win-x64/HandCash
          for f in handcash-shell.exe node.exe bridgeSidecar.cjs uiSidecar.cjs handcash-page.js app/index.html HandCash.cmd; do
            test -f "$DIR/$f" || { echo "missing $DIR/$f" >&2; exit 1; }
          done
          test -f "release/HandCash-${VERSION}-x64-win.zip"

      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "HandCash Desktop ${{ steps.meta.outputs.version }} BETA" \
              --notes "HandCash Desktop ${{ steps.meta.outputs.version }} (BETA) — Windows build from CI." \
              --prerelease \
              --target "${{ github.sha }}"
          fi

      - name: Upload Windows artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          f="release/HandCash-${{ steps.meta.outputs.version }}-x64-win.zip"
          test -f "$f" || { echo "No Windows zip at $f" >&2; ls -la release/ || true; exit 1; }
          gh release upload "$TAG" "$f" --repo "${{ github.repository }}" --clobber
          echo "Uploaded $f to $TAG"
