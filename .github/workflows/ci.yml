name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install
        run: npm ci

      - name: Install native shell deps (WebKitGTK)
        run: bash scripts/ci-linux-native-deps.sh

      - name: Typecheck
        run: |
          npx tsc -p tsconfig.json --noEmit
          npx tsc -p tsconfig.electron.json --noEmit

      - name: Critical payment regressions
        run: >-
          npm test --
          src/wallet/handleResolve.test.ts
          src/wallet/sendBrc29Payment.test.ts
          src/wallet/spendAttempt.test.ts
          src/wallet/spendGuard.test.ts
          src/wallet/actionReview.test.ts
          src/wallet/sendPayment.test.ts
          src/wallet/utxoHealFromHistory.test.ts

      - name: Full hermetic test suite
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run test:ci

      - name: Renderer + sidecar build
        run: |
          npm run build:renderer
          npm run build:sidecar

      - name: Native shell cargo build
        working-directory: native-desktop
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/native-desktop/target
        run: cargo build

      - name: Upload native shell binary on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-shell-build-logs
          path: |
            native-desktop/target/debug/handcash-shell
            test-results/
          if-no-files-found: ignore
