name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Xvfb for Electron smoke
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Typecheck
        run: |
          npx tsc -p tsconfig.json --noEmit
          npx tsc -p tsconfig.electron.json --noEmit

      - name: Critical payment regressions
        run: >-
          npm test --
          src/wallet/handleResolve.test.ts
          src/wallet/sendBrc29Payment.test.ts
          src/wallet/spendAttempt.test.ts
          src/wallet/spendGuard.test.ts
          src/wallet/actionReview.test.ts
          src/wallet/sendPayment.test.ts
          src/wallet/utxoHealFromHistory.test.ts

      - name: Full hermetic test suite
        run: npm run test:ci

      - name: Renderer build
        run: npm run build:renderer

      - name: Electron build
        run: npm run build:electron

      - name: Electron smoke and visual regressions
        run: xvfb-run -a npm run test:e2e

      - name: Upload Electron test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: electron-test-results
          path: test-results/
          if-no-files-found: ignore
